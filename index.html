(function(){
const P={banua:{n:'Hijau Lembut',main:'#5E8C61',accent:'#E9B44C'},lime:{n:'Biru Tenang',main:'#5B8DB8',accent:'#F2B880'},pasar:{n:'Oranye Hangat',main:'#E58A4E',accent:'#6B8E7F'}};
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(h,t,p)=>'#'+hx(h).map((v,i)=>Math.round(v+(t-v)*p).toString(16).padStart(2,'0')).join('');
let st;try{st=JSON.parse(localStorage.getItem('amat_theme'))}catch(e){}
window.themeState=st||{preset:'banua'};
const save=()=>{try{localStorage.setItem('amat_theme',JSON.stringify(window.themeState))}catch(e){}};
window.getTheme=()=>{const t=window.themeState;if(t.preset==='custom'&&t.main&&t.accent)return t;const k=P[t.preset]?t.preset:'banua';return{preset:k,main:P[k].main,accent:P[k].accent}};
window.applyTheme=()=>{const t=getTheme(),r=document.documentElement.style,a=hx(t.accent);
r.setProperty('--t-main',t.main);r.setProperty('--t-dark',mix(t.main,0,.2));r.setProperty('--t-light',mix(t.main,255,.88));r.setProperty('--t-bg',mix(t.main,255,.95));
r.setProperty('--t-accent',t.accent);r.setProperty('--t-accent-text',(.299*a[0]+.587*a[1]+.114*a[2])>150?'#1F2937':'#FFFFFF');
const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t.main};
window.themePickerInner=()=>{const t=getTheme();
const b=Object.entries(P).map(([k,p])=>`<button onclick="setTheme('${k}')" class="flex-1 p-2 rounded-xl border-2 text-[10px] font-bold bg-white text-gray-700 ${t.preset===k?'border-gray-800':'border-gray-200'}"><div class="flex h-6 rounded-lg overflow-hidden mb-1"><span class="flex-1" style="background:${p.main}"></span><span class="flex-1" style="background:${p.accent}"></span></div>${p.n}</button>`).join('');
return `<div class="flex gap-2 mb-3">${b}</div><p class="text-[10px] font-bold text-gray-500 mb-1">Atur warna sendiri:</p><div class="flex gap-2"><label class="flex-1 text-[10px] font-bold text-gray-500">Utama<input type="color" value="${t.main}" oninput="setCustomTheme(this.value,null)" onchange="refreshThemePicker()" class="block w-full h-9 mt-1 rounded border"></label><label class="flex-1 text-[10px] font-bold text-gray-500">Aksen<input type="color" value="${t.accent}" oninput="setCustomTheme(null,this.value)" onchange="refreshThemePicker()" class="block w-full h-9 mt-1 rounded border"></label></div>`};
window.themePicker=()=>`<div id="theme-picker">${themePickerInner()}</div>`;
window.refreshThemePicker=()=>document.querySelectorAll('#theme-picker').forEach(e=>e.innerHTML=themePickerInner());
window.setTheme=k=>{window.themeState={preset:k};save();applyTheme();refreshThemePicker()};

applyTheme();
})();
</script>

    window.calcOfflinePrayerHST = (dt = new Date()) => {
        const lat = -2.5833, lon = 115.3833, tz = 8;
        const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
        const jd = Math.floor(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()) / 86400000) + 2440587.5;
        const d = jd - 2451545.0;
        const g = (357.529 + 0.98560028 * d) % 360;
        const q = (280.459 + 0.98564736 * d) % 360;
        const L = (q + 1.915 * Math.sin(rad(g)) + 0.020 * Math.sin(rad(2 * g))) % 360;
        const e = 23.439 - 0.00000036 * d;
        const decl = deg(Math.asin(Math.sin(rad(e)) * Math.sin(rad(L))));
        const ra = deg(Math.atan2(Math.cos(rad(e)) * Math.sin(rad(L)), Math.cos(rad(L)))) / 15;
        const eqt = ((q / 15) - ((ra + 24) % 24));
        const transit = 12 + tz - (lon / 15) - eqt;
        const hourAngle = (angle) => {
            const cosH = (Math.sin(rad(angle)) - Math.sin(rad(lat)) * Math.sin(rad(decl))) / (Math.cos(rad(lat)) * Math.cos(rad(decl)));
            return deg(Math.acos(Math.max(-1, Math.min(1, cosH)))) / 15;
        };
        const asharAngle = -deg(Math.atan(1 / (1 + Math.tan(rad(Math.abs(lat - decl))))));
        const fmt = (h) => {
            const totalMins = Math.round(((h + 24) % 24) * 60);
            return String(Math.floor(totalMins / 60) % 24).padStart(2, '0') + ':' + String(totalMins % 60).padStart(2, '0');
        };
        const subuhVal = transit - hourAngle(-20) + 2/60;
        return {
            imsak: fmt(subuhVal - 10/60),
            subuh: fmt(subuhVal),
            syuruq: fmt(transit - hourAngle(-0.833) - 2/60),
            dzuhur: fmt(transit + 3/60),
            ashar: fmt(transit + hourAngle(asharAngle) + 2/60),
            maghrib: fmt(transit + hourAngle(-0.833) + 2/60),
            isya: fmt(transit + hourAngle(-18) + 2/60)
        };
    };

    window.syncDailyPrayerSchedule = async (force = false) => {
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        if (!force && state.prayerScheduleDate === todayStr) return;

        // Perhitungan harian otomatis offline (selalu akurat setiap hari)
        state.prayerScheduleHST = calcOfflinePrayerHST(now);
        state.prayerScheduleDate = todayStr;
        state.hijriDate = computeHijri(state, now);

        // Sumber utama: EQuran.id Jadwal Shalat API — ambil 1 BULAN sekaligus
        // lalu dicache (state.prayerScheduleMonth), jadi nggak perlu nge-fetch
        // tiap hari, cukup sekali tiap pergantian bulan.
        const y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
        const monthKey = y + '-' + m;
        let jadwalHariIni = null;

        try {
            let bulanData = (state.prayerScheduleMonth && state.prayerScheduleMonth.key === monthKey) ? state.prayerScheduleMonth.jadwal : null;

            if (!bulanData) {
                const res = await fetch('https://equran.id/api/v2/shalat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ provinsi: 'Kalimantan Selatan', kabkota: 'Kab. Hulu Sungai Tengah', bulan: m, tahun: y })
                });
                const json = await res.json();
                if (json && json.code === 200 && json.data && Array.isArray(json.data.jadwal)) {
                    bulanData = json.data.jadwal;
                    state.prayerScheduleMonth = { key: monthKey, jadwal: bulanData };
                }
            }
            const j = bulanData && bulanData.find(x => x.tanggal === d);
            if (j) jadwalHariIni = { imsak: j.imsak, subuh: j.subuh, syuruq: j.terbit, dzuhur: j.dzuhur, ashar: j.ashar, maghrib: j.maghrib, isya: j.isya };
        } catch (e) {}

        // Cadangan: kalau EQuran.id gagal/belum punya datanya, coba MyQuran (harian)
        if (!jadwalHariIni) {
            try {
                const ys = y, ms = String(m).padStart(2, '0'), ds = String(d).padStart(2, '0');
                const res = await fetch(`https://api.myquran.com/v2/sholat/jadwal/2206/${ys}/${ms}/${ds}`);
                const json = await res.json();
                if (json && json.status && json.data && json.data.jadwal) {
                    const j = json.data.jadwal;
                    jadwalHariIni = { imsak: j.imsak, subuh: j.subuh, syuruq: j.terbit, dzuhur: j.dzuhur, ashar: j.ashar, maghrib: j.maghrib, isya: j.isya };
                }
            } catch (e) {}
        }

        if (jadwalHariIni) state.prayerScheduleHST = jadwalHariIni;
        saveState();
        render();
        if (force) showToast('Jadwal salat hari ini diperbarui ✅');
    };

    window.getPrayerTimeInfo = () => {
        const now = new Date();
        const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        if (state.prayerScheduleDate !== todayKey) {
            state.prayerScheduleHST = calcOfflinePrayerHST(now);
            state.prayerScheduleDate = todayKey;
        }
        const curMins = now.getHours() * 60 + now.getMinutes();
        const pTimes = state.prayerScheduleHST;
        const parseToMins = (tStr) => { if(!tStr) return 0; const [h, m] = tStr.split(':').map(Number); return h * 60 + m; };
        const list = [
            { name: 'Imsak', mins: parseToMins(pTimes.imsak||'04:45'), timeStr: pTimes.imsak||'04:45' }, { name: 'Subuh', mins: parseToMins(pTimes.subuh||'04:55'), timeStr: pTimes.subuh||'04:55' },
            { name: 'Syuruq', mins: parseToMins(pTimes.syuruq||'06:12'), timeStr: pTimes.syuruq||'06:12' }, { name: 'Dzuhur', mins: parseToMins(pTimes.dzuhur||'12:18'), timeStr: pTimes.dzuhur||'12:18' },
            { name: 'Ashar', mins: parseToMins(pTimes.ashar||'15:35'), timeStr: pTimes.ashar||'15:35' }, { name: 'Maghrib', mins: parseToMins(pTimes.maghrib||'18:22'), timeStr: pTimes.maghrib||'18:22' },
            { name: 'Isya', mins: parseToMins(pTimes.isya||'19:32'), timeStr: pTimes.isya||'19:32' }
        ];
        let nextPrayer = list.find(p => p.mins > curMins) || list[0];
        let isNearPrayer = false, activePrayerName = '', isForcedOpen = false, rawPrayerWindowName = '';
        for(let p of list) {
            if(p.name === 'Syuruq' || p.name === 'Imsak') continue;
            if(curMins >= (p.mins - 15) && curMins <= (p.mins + 35)) {
                rawPrayerWindowName = p.name;
                if (state.prayerForceOpenKey === `${p.name}_${todayKey}`) {
                    isForcedOpen = true;
                } else {
                    isNearPrayer = true;
                    activePrayerName = p.name;
                }
                break;
            }
        }
        return { nextPrayer, isNearPrayer, activePrayerName, isForcedOpen, rawPrayerWindowName, todayKey, list };
    };

    window.verifyPinAndCheckout = async () => {
        const key = 'pin:' + state.loggedInUser.id;
        const locks = getLoginLock(); const rec = locks[key];
        if (rec && rec.lockUntil > Date.now()) {
            const sisa = Math.ceil((rec.lockUntil - Date.now()) / 60000);
            document.getElementById('c-pin').value = '';
            return showToast(`Terlalu banyak percobaan PIN salah. Coba lagi ${sisa} menit lagi.`, 'error');
        }
        const entered = document.getElementById('c-pin').value;
        if(await secretMatch(state.loggedInUser.id, state.loggedInUser.pin, entered)) {
            const l = getLoginLock(); delete l[key]; setLoginLock(l);
            closeModal(); setTimeout(() => { processCustCheckout(state.checkoutMethod, state.checkoutRegion, state.checkoutAddress, state.paymentType); }, 150);
        } else {
            const l = getLoginLock(); const r = l[key] && l[key].lockUntil <= Date.now() ? { count: 0 } : (l[key] || { count: 0 });
            r.count++;
            if (r.count >= LOGIN_MAX_TRY) { r.lockUntil = Date.now() + LOGIN_LOCK_MINUTES * 60000; showToast(`Terlalu banyak PIN salah. Checkout dikunci ${LOGIN_LOCK_MINUTES} menit.`, 'error'); }
            else showToast(`PIN Transaksi Salah! (percobaan ke-${r.count}/${LOGIN_MAX_TRY})`, 'error');
            l[key] = r; setLoginLock(l);
            document.getElementById('c-pin').value = '';
        }

    window.processCustCheckout = (method, regionName, address, payType) => {
        const selectedItems = state.cart.filter(i => i.selected);
        if(selectedItems.length === 0) return showToast('Pilih barang dulu!', 'error');
        const allDigitalOrWifi = selectedItems.every(i => i.product.productType === 'wifi' || i.product.productType === 'ppob');
        if(method === 'delivery' && !allDigitalOrWifi && !state.deliveryActive) return showToast('Layanan pengiriman sedang nonaktif!', 'error');
        if(method === 'pickup' && !allDigitalOrWifi && !state.pickupActive) return showToast('Layanan Ambil di Tempat sedang nonaktif!', 'error');

        const finalItems = selectedItems.map(item => ({ ...item, purchasedPrice: getItemUnitPrice(item.product, item.qty), modalPrice: Number(item.product.modal) || 0 }));
        const subtotal = finalItems.reduce((sum, item) => sum + (item.purchasedPrice * item.qty), 0);
        let ongkir = 0;
        if(method === 'delivery' && !allDigitalOrWifi) {
            const reg = state.regions.find(r => r.name === regionName);
            if(!reg) return showToast('Pilih wilayah valid', 'error');
            if(subtotal < reg.minFree) ongkir = reg.ongkir;
        }
        const total = subtotal + ongkir;

        const wifiStockError = finalItems.filter(i => i.product.productType === 'wifi').find(i => {
            const availCount = getRealProductStock(i.product);
            return availCount < i.qty;
        });
        if(wifiStockError) return showToast(`Stok kode Wi-Fi "${wifiStockError.product.name}" tidak cukup!`, 'error');

        if(payType === 'saldo') {
            if(getBal(state.loggedInUser) < total) return showToast('Saldo Akun tidak mencukupi!', 'error');
            if(state.loggedInUser.role !== 'admin') balLog(state.loggedInUser, -total, 'Belanja', 'Pembayaran pesanan', state.loggedInUser.name);
            const uAcc = state.users.find(u => u.id === state.loggedInUser.id);
            if(uAcc && state.loggedInUser.role !== 'admin') uAcc.balance = state.loggedInUser.balance;
        }
        
        const prayerInfo = getPrayerTimeInfo(); const isPO = !allDigitalOrWifi && prayerInfo.isNearPrayer;
        selectedItems.forEach(cartItem => {
            const p = state.products.find(x => String(x.id) === String(cartItem.product.id));
            if(p) {
                if(p.productType !== 'wifi') p.stock = Math.max(0, (Number(p.stock) || 0) - cartItem.qty);
                p.sold = (Number(p.sold) || 0) + cartItem.qty;
            }
        });
        state.cart = state.cart.filter(i => !i.selected);

        const currentPurchaseTime = new Date().toLocaleString('id-ID');
        const orderId = (isPO ? 'PO-' : 'ORD-') + generateId().toUpperCase();
        finalItems.forEach(item => {
            if(item.product.productType === 'wifi') {
                item.assignedCodes = [];
                for(let k = 0; k < item.qty; k++) {
                    const availableVoucher = findAvailableWifiVoucher(item.product);
                    if(availableVoucher) {
                        availableVoucher.status = 'used';
                        availableVoucher.orderId = orderId;
                        availableVoucher.pembeli = state.loggedInUser ? state.loggedInUser.name : 'Pelanggan';
                        availableVoucher.purchaseTimestamp = currentPurchaseTime;
                        item.assignedCodes.push(availableVoucher.code);
                    }
                }
            }
        });

        const newOrder = {
            id: orderId, date: currentPurchaseTime,
            customerId: state.loggedInUser.id || state.adminProfile.id, customerName: state.loggedInUser.name, customerPhone: state.loggedInUser.phone || '-',
            method: allDigitalOrWifi ? 'Digital / Layanan' : method,
            region: allDigitalOrWifi ? 'Layanan Digital' : (method === 'pickup' ? 'Ambil di Toko' : regionName),
            address: allDigitalOrWifi ? '-' : (method === 'pickup' ? '-' : address),
            items: finalItems, subtotal, ongkir, total, paymentType: payType, status: isPO ? 'Pre-Order (Jeda Salat)' : 'Menunggu Diproses'
        };

        if (!Array.isArray(state.orders)) state.orders = [];
        state.orders.unshift(newOrder);
        saveState();

        const poNotice = isPO ? `\n*(Pre-Order: Dikirim setelah Salat ${prayerInfo.activePrayerName})*` : '';
        const payNotice = payType === 'saldo' ? '\n*Pembayaran:* Potong Saldo Akun (LUNAS)' : '\n*Pembayaran:* Bayar di Tempat / WA';
        const waText = encodeURIComponent(`Halo Admin Amat Bajualan, Pesanan Baru!\n*ID:* ${newOrder.id}${poNotice}\n*Pemesan:* ${newOrder.customerName} (${newOrder.customerPhone})\n*Tipe:* ${allDigitalOrWifi?'Layanan Digital':method==='pickup'?'Ambil Sendiri':'Diantar'} (${newOrder.region})\n*Alamat:* ${newOrder.address}\n\n*Rincian Barang:*\n${finalItems.map(i => `- ${i.qty}x ${i.product.name}${i.targetPhone ? ` [Tujuan: ${i.targetPhone}]` : ''} (${formatRp(i.purchasedPrice*i.qty)})`).join('\n')}\n\n*Subtotal:* ${formatRp(subtotal)}\n*Ongkir:* ${formatRp(ongkir)}\n*TOTAL BAYAR:* ${formatRp(total)}${payNotice}`);
        const num = state.adminProfile.phone.replace(/[^0-9]/g, '');

        setTimeout(() => { openWhatsAppSelectorModal(newOrder, waText, num); }, 150);
        render();
    };

    window.promptEditCustomerOrder = (orderId) => {

    window.renderEditCustomerOrderModal = () => {
        const d = window._editOrdDraft;
        if (!d) return;
        const activeProds = state.products.filter(p => p.isActive && p.productType !== 'wifi' && getRealProductStock(p) > 0);
        const subtotal = d.items.reduce((s, i) => s + (Number(i.purchasedPrice) * Number(i.qty)), 0);
        const isDelivery = d.method === 'delivery';
        const selReg = isDelivery ? state.regions.find(r => r.name === d.region) : null;
        const ongkir = (isDelivery && selReg && subtotal < selReg.minFree) ? Number(selReg.ongkir || 0) : 0;
        const total = subtotal + ongkir;

        showModal(`✏️ Edit Pesanan (${d.id})`, `
            <div class="space-y-3 text-left">
                <div>
                    <p class="text-[10px] font-bold text-gray-500 uppercase mb-1">Daftar Barang</p>
                    <div class="space-y-2">
                        ${d.items.map((it, idx) => `
                            <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl border text-xs">
                                <div class="flex-1 min-w-0 pr-2">
                                    <p class="font-bold truncate">${escapeHTML(it.product.name)}</p>
                                    <p class="text-[10px] text-orange-600 font-bold">${formatRp(it.purchasedPrice)} / item</p>
                                </div>
                                <div class="flex items-center gap-1.5 shrink-0">
                                    <button type="button" onclick="editDraftOrderQty(${idx}, -1)" class="w-7 h-7 rounded-lg bg-white border font-bold">-</button>
                                    <span class="w-6 text-center font-black">${it.qty}</span>
                                    <button type="button" onclick="editDraftOrderQty(${idx}, 1)" class="w-7 h-7 rounded-lg bg-white border font-bold">+</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="flex gap-1.5">
                    <select id="eo-add-prod" class="flex-1 border p-2 rounded-xl text-xs bg-gray-50">
                        <option value="">+ Tambah produk lain...</option>
                        ${activeProds.map(p => `<option value="${p.id}">${escapeHTML(p.name)} (${formatRp(p.price)})</option>`).join('')}
                    </select>
                    <button type="button" onclick="addProductToDraftOrder()" class="bg-gray-900 text-white px-3 rounded-xl text-xs font-bold">Tambah</button>
                </div>
                ${d.method !== 'Digital / Layanan' ? `
                <div>
                    <p class="text-[10px] font-bold text-gray-500 uppercase mb-1">Metode Pengiriman</p>
                    <div class="flex gap-2 mb-2">
                        <button type="button" onclick="window._editOrdDraft.method='delivery'; renderEditCustomerOrderModal()" class="flex-1 py-2 rounded-xl text-xs font-bold border ${d.method==='delivery'?'bg-orange-50 text-orange-700 border-orange-400':'bg-white text-gray-500'}">🛵 Kirim Alamat</button>
                        <button type="button" onclick="window._editOrdDraft.method='pickup'; renderEditCustomerOrderModal()" class="flex-1 py-2 rounded-xl text-xs font-bold border ${d.method==='pickup'?'bg-orange-50 text-orange-700 border-orange-400':'bg-white text-gray-500'}">🚶 Ambil Sendiri</button>
                    </div>
                    ${d.method === 'delivery' ? `
                        <select onchange="window._editOrdDraft.region=this.value; renderEditCustomerOrderModal()" class="w-full border p-2 rounded-xl text-xs bg-gray-50 mb-2 font-bold">
                            <option value="">-- Pilih Wilayah --</option>
                            ${state.regions.filter(r => r.isActive && !r.pickupOnly).map(r => `<option value="${escapeHTML(r.name)}" ${d.region===r.name?'selected':''}>${escapeHTML(r.name)}</option>`).join('')}
                        </select>
                        <textarea oninput="window._editOrdDraft.address=this.value" placeholder="Detail alamat..." class="w-full border p-2 rounded-xl text-xs bg-gray-50 h-16">${escapeHTML(d.address === '-' ? '' : d.address)}</textarea>
                    ` : ''}
                </div>` : ''}
                <div>
                    <p class="text-[10px] font-bold text-gray-500 uppercase mb-1">Pembayaran</p>
                    <div class="flex gap-2">
                        <button type="button" onclick="window._editOrdDraft.paymentType='wa'; renderEditCustomerOrderModal()" class="flex-1 py-2 rounded-xl text-xs font-bold border ${d.paymentType!=='saldo'?'bg-green-600 text-white':'bg-white text-gray-600'}">💬 WA / COD</button>
                        <button type="button" onclick="window._editOrdDraft.paymentType='saldo'; renderEditCustomerOrderModal()" class="flex-1 py-2 rounded-xl text-xs font-bold border ${d.paymentType==='saldo'?'bg-amber-500 text-white':'bg-white text-gray-600'}">💰 Saldo (${formatRp(getBal(state.loggedInUser))})</button>
                    </div>
                </div>
                <div class="bg-orange-50 p-3 rounded-xl border border-orange-200 text-xs space-y-1">
                    <div class="flex justify-between"><span>Subtotal:</span><b>${formatRp(subtotal)}</b></div>
                    <div class="flex justify-between"><span>Ongkir:</span><b>${formatRp(ongkir)}</b></div>
                    <div class="flex justify-between text-sm font-black text-orange-600 border-t border-orange-200 pt-1"><span>Total Baru:</span><span>${formatRp(total)}</span></div>
                </div>
            </div>
        `, `<div class="flex gap-2">
            <button onclick="window._editOrdDraft=null; closeModal()" class="flex-1 bg-gray-100 text-gray-800 py-3 rounded-xl font-bold">Batal</button>
            <button onclick="saveEditCustomerOrder()" class="flex-1 bg-orange-500 text-white py-3 rounded-xl font-bold shadow-md">Simpan Perubahan</button>
        </div>`);
    };

    window.editDraftOrderQty = (idx, delta) => {
        const d = window._editOrdDraft;
        if (!d || !d.items[idx]) return;
        const item = d.items[idx];
        const origOrder = state.orders.find(x => x.id === d.id);
        const origQty = origOrder ? (origOrder.items.find(x => String(x.product.id) === String(item.product.id))?.qty || 0) : 0;
        const prod = state.products.find(p => String(p.id) === String(item.product.id));
        const maxAvail = (prod ? getRealProductStock(prod) : 0) + origQty;
        const nextQty = item.qty + delta;
        if (nextQty > maxAvail) return showToast('Melebihi stok tersedia!', 'error');
        if (nextQty <= 0) {
            if (d.items.length <= 1) return showToast('Minimal harus ada 1 barang (atau batalkan pesanan)', 'error');
            d.items.splice(idx, 1);
        } else {
            item.qty = nextQty;
        }
        renderEditCustomerOrderModal();
    };

    window.addProductToDraftOrder = () => {
        const d = window._editOrdDraft;
        const pid = document.getElementById('eo-add-prod')?.value;
        if (!d || !pid) return;
        const prod = state.products.find(p => String(p.id) === String(pid));
        if (!prod) return;
        const existingIdx = d.items.findIndex(i => String(i.product.id) === String(pid));
        if (existingIdx >= 0) {
            editDraftOrderQty(existingIdx, 1);
        } else {
            d.items.push({ product: prod, qty: 1, purchasedPrice: getItemUnitPrice(prod, 1), modalPrice: Number(prod.modal) || 0, selected: true });
            renderEditCustomerOrderModal();
        }
    };

    window.saveEditCustomerOrder = () => {
        const d = window._editOrdDraft;
        if (!d) return;
        const orig = state.orders.find(x => x.id === d.id);
        if (!orig || (orig.status !== 'Menunggu Diproses' && !String(orig.status).includes('Pre-Order'))) {
            closeModal();
            return showToast('Pesanan sudah diproses admin, tidak bisa diubah', 'error');
        }
        if (d.method === 'delivery' && (!d.region || !d.address || d.address === '-')) {
            return showToast('Lengkapi wilayah & alamat pengiriman!', 'error');
        }

        const subtotal = d.items.reduce((s, i) => s + (Number(i.purchasedPrice) * Number(i.qty)), 0);
        const selReg = d.method === 'delivery' ? state.regions.find(r => r.name === d.region) : null;
        const ongkir = (d.method === 'delivery' && selReg && subtotal < selReg.minFree) ? Number(selReg.ongkir || 0) : 0;
        const newTotal = subtotal + ongkir;

        // Penyesuaian saldo jika metode bayar pakai saldo
        const uAcc = state.users.find(u => u.id === orig.customerId);
        const oldPaidSaldo = orig.paymentType === 'saldo' ? Number(orig.total || 0) : 0;
        const newNeedSaldo = d.paymentType === 'saldo' ? newTotal : 0;
        const saldoDiff = newNeedSaldo - oldPaidSaldo;

        if (saldoDiff > 0 && state.loggedInUser?.role !== 'admin') {
            if (getBal(state.loggedInUser) < saldoDiff) return showToast('Saldo tidak cukup untuk selisih perubahan!', 'error');
            balLog(state.loggedInUser, -saldoDiff, 'Edit Pesanan', 'Selisih perubahan ' + orig.id, state.loggedInUser.name);
            if (uAcc) uAcc.balance = state.loggedInUser.balance;
        } else if (saldoDiff < 0 && state.loggedInUser?.role !== 'admin') {
            balLog(state.loggedInUser, Math.abs(saldoDiff), 'Pengembalian Edit Pesanan', 'Selisih perubahan ' + orig.id, state.loggedInUser.name);
            if (uAcc) uAcc.balance = state.loggedInUser.balance;
        }

        // Kembalikan stok lama lalu kurangi stok baru
        orig.items.forEach(it => {
            const p = state.products.find(x => String(x.id) === String(it.product.id));
            if (p && p.productType !== 'wifi') {
                p.stock = (Number(p.stock) || 0) + Number(it.qty);
                p.sold = Math.max(0, (Number(p.sold) || 0) - Number(it.qty));
            }
        });
        d.items.forEach(it => {
            const p = state.products.find(x => String(x.id) === String(it.product.id));
            if (p && p.productType !== 'wifi') {
                p.stock = Math.max(0, (Number(p.stock) || 0) - Number(it.qty));
                p.sold = (Number(p.sold) || 0) + Number(it.qty);
            }
        });

        orig.items = d.items;
        orig.method = d.method;
        orig.region = d.method === 'Digital / Layanan' ? 'Layanan Digital' : (d.method === 'pickup' ? 'Ambil di Toko' : d.region);
        orig.address = d.method === 'delivery' ? d.address : '-';
        orig.paymentType = d.paymentType;
        orig.subtotal = subtotal;
        orig.ongkir = ongkir;
        orig.total = newTotal;

        window._editOrdDraft = null;
        saveState();
        closeModal();
        render();
        showToast('Perubahan pesanan berhasil disimpan ✅');
    };

    // ===== Rincian Keranjang Kasir: ubah jumlah / hapus satu-satu item =====
    window.promptKasirCartDetail = () => {
        if(state.kasirCart.length === 0) return closeModal();
        showModal('Keranjang Kasir', `<div class="space-y-2 max-h-[55vh] overflow-y-auto">${state.kasirCart.map(item => `
            <div class="flex items-center gap-2 bg-gray-50 p-2.5 rounded-xl border relative">
                <button onclick="kasirCartRemove('${item.product.id}')" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] shadow"><i class="ph-bold ph-x"></i></button>
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-xs truncate">${escapeHTML(item.product.name)}</p>
                    <p class="text-orange-600 font-black text-xs">${formatRp(item.product.price * item.qty)}</p>
                </div>
                <div class="flex items-center bg-white rounded-lg border shrink-0">
                    <button onclick="kasirCartQty('${item.product.id}', -1)" class="w-7 h-7 font-bold text-gray-600">-</button>
                    <span class="w-6 text-center text-xs font-bold">${item.qty}</span>
                    <button onclick="kasirCartQty('${item.product.id}', 1)" class="w-7 h-7 font-bold text-gray-600">+</button>
                </div>
            </div>
        `).join('')}</div>`, `<button onclick="closeModal()" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold shadow-md">Tutup</button>`);
    };
    window.kasirCartQty = (id, delta) => { updateCartQty(id, delta, true); promptKasirCartDetail(); };
    window.kasirCartRemove = (id) => { updateCartQty(id, -9999, true); promptKasirCartDetail(); };

    // ===== Modal Pembayaran Tunai (uang diterima + kembalian otomatis) =====
    window.openKasirPaymentModal = () => {
        if(state.kasirCart.length === 0) return showToast('Keranjang kosong', 'error');
        const total = state.kasirCart.reduce((a,b)=>a+(b.product.price*b.qty),0);
        window._kasirPayTotal = total;
        showModal('Pembayaran', `
            <div class="bg-blue-50 p-4 rounded-xl text-center border border-blue-100 mb-3">
                <p class="text-[10px] text-blue-600 font-bold uppercase tracking-wider mb-1">Total Tagihan</p>
                <p class="text-2xl font-black text-gray-800">${formatRp(total)}</p>
            </div>
            <label class="text-[10px] font-bold text-gray-500 uppercase">Uang Diterima</label>
            <input type="number" id="kp-uang" oninput="kasirCalcChange()" value="${total}" class="w-full border p-3 rounded-xl text-lg font-bold bg-gray-50 outline-none mb-2" placeholder="0">
            <div id="kp-quick" class="grid grid-cols-3 gap-2 mb-3"></div>
            <div class="flex justify-between items-center p-3 bg-gray-100 rounded-xl mb-1">
                <span class="text-sm font-medium text-gray-600">Kembalian</span>
                <span id="kp-kembalian" class="text-lg font-bold text-gray-800">Rp 0</span>
            </div>
            <p id="kp-error" class="hidden text-center text-xs font-bold text-red-500 bg-red-50 p-2 rounded-lg">Uang yang diterima kurang!</p>
        `, `<div class="flex gap-2"><button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-800 py-3 rounded-xl font-bold">Batal</button><button id="kp-confirm" onclick="kasirConfirmPayment()" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold shadow-md">Selesai & Simpan</button></div>`);
        setTimeout(() => { kasirGenQuickCash(total); kasirCalcChange(); }, 0);
    };
    window.kasirGenQuickCash = (total) => {
        const box = document.getElementById('kp-quick'); if(!box) return;
        const notes = [5000, 10000, 20000, 50000, 100000], sug = [total];
        for(const n of notes) { const r = Math.ceil(total / n) * n; if(r > total && !sug.includes(r)) sug.push(r); if(sug.length >= 3) break; }
        box.innerHTML = sug.slice(0,3).map((a,i) => `<button onclick="kasirSetQuickCash(${a})" class="py-2 border rounded-lg text-xs font-bold text-gray-700 bg-gray-50 active:bg-orange-50">${i===0?'Uang Pas':formatRp(a)}</button>`).join('');
    };
    window.kasirSetQuickCash = (amount) => { document.getElementById('kp-uang').value = amount; kasirCalcChange(); };
    window.kasirCalcChange = () => {
        const uang = Number(document.getElementById('kp-uang').value) || 0, total = window._kasirPayTotal || 0;
        const kembEl = document.getElementById('kp-kembalian'), errEl = document.getElementById('kp-error'), btn = document.getElementById('kp-confirm');
        if(uang < total) { errEl.classList.remove('hidden'); kembEl.textContent = 'Rp 0'; kembEl.classList.remove('text-green-600'); btn.disabled = true; btn.classList.add('opacity-40'); }
        else { errEl.classList.add('hidden'); kembEl.textContent = formatRp(uang - total); kembEl.classList.add('text-green-600'); btn.disabled = false; btn.classList.remove('opacity-40'); }
    };
    window.kasirConfirmPayment = () => {
        const uang = Number(document.getElementById('kp-uang').value) || 0, total = window._kasirPayTotal || 0;
        if(uang < total) return;
        processKasirCheckout(document.getElementById('k-cust') ? document.getElementById('k-cust').value : '', uang);
    };

    window.processKasirCheckout = (custName, cashReceived) => {
        if(state.kasirCart.length === 0) return showToast('Keranjang kosong', 'error');
        if(state.kasirShiftClosed) { state.kasirShiftClosed=false; state.kasirShiftStart=Date.now(); }
        
        for(let item of state.kasirCart) { const p = state.products.find(x => x.id === item.product.id); if(!p || p.stock < item.qty) return showToast(`Stok "${item.product.name}" kurang!`, 'error'); }
        const finalItems = state.kasirCart.map(item => ({ ...item, purchasedPrice: item.product.price, modalPrice: item.product.modal||0 }));
        const total = finalItems.reduce((sum, item) => sum + (item.purchasedPrice * item.qty), 0);
        const uang = Number(cashReceived) || total, kembalian = uang - total;
        
        state.kasirCart.forEach(cartItem => { const p = state.products.find(x => x.id === cartItem.product.id); if(p) { p.stock -= cartItem.qty; p.sold += cartItem.qty; } });
        
        const qNum = 'A' + String(state.kasirQueueCounter).padStart(3, '0');
        state.kasirQueueCounter++;
        
        const newOrder = {
            id: 'POS-' + generateId().toUpperCase(), queueNumber: qNum, date: new Date().toLocaleString('id-ID'), timestamp: Date.now(),
            customerName: custName || 'Pelanggan Umum', customerPhone: '-', method: 'Kasir', region: 'Di Toko', address: '-',
            items: finalItems, subtotal: total, ongkir: 0, total: total, status: 'Selesai', paymentType: 'cash', cashReceived: uang, change: kembalian
        };
        state.orders.unshift(newOrder); state.kasirCart = []; saveState();
        showModal('Transaksi Berhasil', `<div class="text-center"><p class="text-gray-500 text-sm">Nomor Antrean:</p><h1 class="text-4xl font-black text-orange-500 my-2">${qNum}</h1><p class="font-bold text-gray-800 mb-2">Total: ${formatRp(total)}</p><div class="flex justify-between text-sm border-t pt-2"><span class="text-gray-500">Uang Diterima</span><span class="font-bold">${formatRp(uang)}</span></div><div class="flex justify-between text-sm"><span class="text-gray-500">Kembalian</span><span class="font-black text-green-600">${formatRp(kembalian)}</span></div></div>`, `<button onclick="closeModal();" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold shadow-md">Selesai</button>`); render();
    };

    window.holdKasirOrder = () => {
        if(state.kasirCart.length === 0) return;
        state.kasirHeldOrders.push({ id: Date.now(), time: new Date().toLocaleTimeString(), items: JSON.parse(JSON.stringify(state.kasirCart)) });
        state.kasirCart = []; saveState(); render(); showToast('Pesanan Ditahan');
    };
    window.restoreKasirOrder = (id) => {
        const h = state.kasirHeldOrders.find(x => x.id === id); if(!h) return;
        state.kasirCart = h.items; state.kasirHeldOrders = state.kasirHeldOrders.filter(x => x.id !== id);
        saveState(); render(); closeModal();
    };
    
    window.promptHeldOrders = () => {
        showModal('Pesanan Ditahan', `<div class="space-y-2">${state.kasirHeldOrders.map(h=>`
            <div class="flex justify-between items-center bg-gray-50 p-3 border rounded-xl">
                <div><p class="font-bold">Ditahan: ${h.time}</p><p class="text-xs text-gray-500">${h.items.length} Barang</p></div>
                <button onclick="restoreKasirOrder(${h.id})" class="bg-orange-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-md">Lanjutkan</button>
            </div>`).join('')}
        </div>`, `<button onclick="closeModal()" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold shadow-md">Tutup</button>`);
    };

    window.promptRefundKasir = (id) => {
        showModal('Refund Pesanan', `<p class="text-xs text-gray-500 mb-2">Alasan refund/retur barang:</p><input type="text" id="ref-reason" class="w-full border p-3 rounded-xl bg-gray-50 outline-none">`, `<div class="flex gap-2"><button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-800 py-3 rounded-xl font-bold">Batal</button><button onclick="processRefund('${id}'); closeModal();" class="flex-1 bg-red-500 text-white p-3 rounded-xl font-bold shadow-md">Proses Refund</button></div>`);
    };
    window.processRefund = (id) => {
        const o = state.orders.find(x => x.id === id); if(!o || o.status === 'Refund') return;
        const reason = document.getElementById('ref-reason')?.value || 'Dikembalikan';
        o.status = 'Refund';
        o.items.forEach(i => { const p = state.products.find(prod => prod.id === i.product.id); if(p) { p.stock += i.qty; p.sold -= i.qty; } });
        if(o.paymentType === 'saldo' && o.customerId) { const u = state.users.find(x => x.id === o.customerId); if(u) { balLog(u, o.total, 'Pengembalian Saldo', 'Pesanan ' + o.id, 'Sistem'); if(state.loggedInUser?.id === o.customerId) state.loggedInUser.balance = u.balance; } }
        logAudit('Refund', `ID: ${id}, Alasan: ${reason}`); saveState(); render(); showToast('Pesanan Di-refund');
    };

    window.promptCloseShift = () => {
        const tStart = state.kasirShiftStart || Date.now();
        const orders = state.orders.filter(o => o.method === 'Kasir' && o.status === 'Selesai' && o.timestamp >= tStart);
        const total = orders.reduce((s,o)=>s+o.total,0);
        showModal('Tutup Shift Kasir', `<div class="space-y-2 text-sm"><div class="flex justify-between"><span>Jml Transaksi:</span><span class="font-bold">${orders.length}</span></div><div class="flex justify-between"><span>Uang Masuk:</span><span class="font-black text-green-600">${formatRp(total)}</span></div></div>`, `<button onclick="state.kasirShiftClosed=true; state.kasirQueueCounter=1; state.kasirTab='laporan'; saveState(); closeModal(); render(); showToast('Shift Ditutup');" class="w-full bg-red-500 text-white py-3 rounded-xl font-bold">Konfirmasi Tutup</button>`);
    };

    window.toggleKurirShift = () => { state.kurirShiftActive = !state.kurirShiftActive; saveState(); render(); showToast(state.kurirShiftActive ? 'Shift Dimulai' : 'Shift Selesai'); };
    
    window.promptLaporKendala = (id) => {
        showModal('Lapor Kendala', `
            <select id="kendala-val" class="w-full border p-3 rounded-xl bg-gray-50">
                <option value="Alamat tidak ditemukan">Alamat tidak ditemukan</option>
                <option value="Pelanggan tidak bisa dihubungi">Pelanggan tidak bisa dihubungi</option>
                <option value="Lainnya">Lainnya</option>
            </select>
        `, `<div class="flex gap-2"><button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-800 py-3 rounded-xl font-bold">Batal</button><button onclick="submitLaporKendala('${id}')" class="flex-1 bg-red-500 text-white py-3 rounded-xl font-bold shadow-md">Lapor ke Admin</button></div>`);
    };

    window.submitLaporKendala = (orderId) => {
        const v = document.getElementById('kendala-val').value;
        const o = state.orders.find(x => x.id === orderId);
        if(!o) return;
        o.status = 'Kendala Pengiriman';
        logAudit('Kendala Kurir', `${orderId}: ${v}`);
        saveState(); closeModal(); render();
        window.open(`https://wa.me/${state.adminProfile.phone.replace(/[^0-9]/g, '')}?text=${encodeURIComponent('Laporan Kendala Order ' + orderId + ': ' + v)}`);
        showToast('Laporan dikirim');
    };

    window.updateOrderStatus = (id, stat) => { const o = state.orders.find(x => x.id === id); if(o) { o.status = stat; saveState(); showToast(`Status Pesanan: ${stat}`); render(); } };
    window.cancelOrder = (id) => {
        const o = state.orders.find(x => x.id === id);
        if(o && o.status !== 'Dibatalkan' && o.status !== 'Selesai') {
            o.status = 'Dibatalkan';
            if(o.paymentType === 'saldo' && o.customerId) { const u = state.users.find(x => x.id === o.customerId); if(u) { balLog(u, o.total, 'Pengembalian Saldo', 'Pesanan ' + o.id, 'Sistem'); if(state.loggedInUser?.id === o.customerId) state.loggedInUser.balance = u.balance; } }
            o.items.forEach(i => { const p = state.products.find(prod => prod.id === i.product.id); if(p) { p.stock += i.qty; p.sold -= i.qty; } });
            logAudit('Batal Pesanan', `ID: ${id}`); saveState(); render(); showToast('Pesanan Dibatalkan', 'error');

    // ===== Pembatasan percobaan login: 5x gagal = kunci 15 menit (per username) =====
    // Dicatat di localStorage HP ini saja (tidak ikut disimpan ke server), jadi
    // ini bukan pengaman mutlak (misal bisa dilewati kalau browsernya di-reset),
    // tapi cukup efektif menahan percobaan tebak-tebakan berulang dari HP yang sama.
    window.WEAK_PASSWORDS = ['123456', '12345678', '123456789', 'password', 'admin', 'qwerty', '111111', '000000', 'abc123', '123123', '1234567890', '12345'];
    window.checkWeakPassword = async (acc) => { for (const w of WEAK_PASSWORDS) { if (await secretMatch(acc.id, acc.password, w)) return true; } return false; };
    window.LOGIN_MAX_TRY = 5; window.LOGIN_LOCK_MINUTES = 15;
    window.getLoginLock = () => { try { return JSON.parse(localStorage.getItem('amat_login_lock') || '{}'); } catch(e) { return {}; } };
    window.setLoginLock = (obj) => { try { localStorage.setItem('amat_login_lock', JSON.stringify(obj)); } catch(e) {} };

    window.handleLogin = async (e) => {
        e.preventDefault(); const u = document.getElementById('l-u').value, p = document.getElementById('l-p').value, ap = state.adminProfile;
        const locks = getLoginLock(); const rec = locks[u];
        if (rec && rec.lockUntil > Date.now()) {
            const sisa = Math.ceil((rec.lockUntil - Date.now()) / 60000);
            return showToast(`Terlalu banyak percobaan gagal. Coba lagi ${sisa} menit lagi.`, 'error');
        }
        const catatGagal = () => {
            const l = getLoginLock(); const r = l[u] && l[u].lockUntil <= Date.now() ? { count: 0 } : (l[u] || { count: 0 });
            r.count++;
            if (r.count >= LOGIN_MAX_TRY) { r.lockUntil = Date.now() + LOGIN_LOCK_MINUTES * 60000; showToast(`Terlalu banyak percobaan gagal. Akun dikunci ${LOGIN_LOCK_MINUTES} menit.`, 'error'); }
            else showToast(`Salah Username/Password (percobaan ke-${r.count}/${LOGIN_MAX_TRY})`, 'error');
            l[u] = r; setLoginLock(l);
        };
        const catatBerhasil = () => { const l = getLoginLock(); delete l[u]; setLoginLock(l); };

        if(u === ap.username && await secretMatch(ap.id || 'ADM-001', ap.password, p)) {
            catatBerhasil();
            state.loggedInUser = { role: 'admin', name: ap.name, id: ap.id || 'ADM-001' };
            if(secureOK() && hasPlain()) { await hashPlain(); saveState(); }
            navigate('admin_orders'); return;
        }
        let acc = null; for(const x of state.users) { if(x.username === u && await secretMatch(x.id, x.password, p)) { acc = x; break; } }
        if(!acc) return catatGagal();
        if(acc.status !== 'active') return showToast('Akun Nonaktif', 'error');
        catatBerhasil();
        state.loggedInUser = acc; if(secureOK() && hasPlain()) { await hashPlain(); saveState(); }
        if(acc.role === 'customer') checkWeakPassword(acc).then(weak => { state.weakPasswordWarning = weak; render(); });
        if(acc.role === 'kasir') { if(!state.kasirShiftStart) state.kasirShiftStart = Date.now(); navigate('kasir_pos'); } else if(acc.role === 'kurir') navigate('kurir_orders'); else navigate('cust_home');
    };

    window.promptAdminSendWA = function(orderId) {
        const order = state.orders.find(o => o.id === orderId);
        if (!order) return showToast('Order tidak ditemukan', 'error');
        if (!order.customerPhone || order.customerPhone === '-' || order.customerPhone === null) return showToast('Customer tidak punya nomor WhatsApp', 'error');

        let phone = String(order.customerPhone).replace(/[^0-9]/g, '');
        if (phone.startsWith('0')) phone = '62' + phone.slice(1);
        else if (phone.startsWith('8')) phone = '62' + phone;

        let wifiCodesText = '';
        const itemsText = (order.items || []).map(i => {
            let line = `- ${i.qty}x ${escapeHTML(i.product.name)} = ${formatRp(i.purchasedPrice * i.qty)}`;
            if(i.assignedCodes && i.assignedCodes.length > 0) {
                wifiCodesText += `\n🔑 *Kode WiFi ${escapeHTML(i.product.name)}:*\n` + i.assignedCodes.map(c => `👉 \`${c}\``).join('\n') + '\n';
            }
            return line;
        }).join('\n');

        const methodText = order.method === 'pickup' ? 'Ambil di Toko' : ('Diantar ke ' + escapeHTML(order.region || ''));

        const paymentText = order.paymentType === 'saldo' ? 'Potong Saldo (LUNAS)' : 'Bayar di Tempat / Transfer';

        const rawText = `Halo *${escapeHTML(order.customerName)}*, terima kasih berbelanja di *amat Bajualan* 🌟\n\n*ID Pesanan:* ${order.id}\n*Tanggal:* ${order.date}\n*Status:* ${order.status}\n*Metode:* ${methodText}\n\n*Rincian Pesanan:*\n${itemsText}\n${wifiCodesText}\n*Subtotal:* ${formatRp(order.subtotal)}${voucherLine}\n*Ongkir:* ${formatRp(order.ongkir)}\n*TOTAL:* ${formatRp(order.total)}\n\n*Pembayaran:* ${paymentText}\n\n_Pesan otomatis dari sistem Amat Bajualan._`;

            <p class="text-xs text-gray-500 text-center mb-3">Kirim ke: <b>+${phone}</b></p>

            <a href="whatsapp://send?phone=${phone}&text=${waTextEncoded}" onclick="closeModal(); logAudit('Kirim WA', 'Order ${orderId} via App')" class="flex justify-between items-center bg-green-500 text-white p-3.5 rounded-xl font-bold text-sm shadow-md mb-2"><span>💬 WhatsApp (Aplikasi HP)</span><i class="ph-bold ph-caret-right"></i></a>
            <a href="https://api.whatsapp.com/send?phone=${phone}&text=${waTextEncoded}" target="_blank" onclick="closeModal(); logAudit('Kirim WA', 'Order ${orderId} via Bisnis')" class="flex justify-between items-center bg-emerald-600 text-white p-3.5 rounded-xl font-bold text-sm shadow-md mb-2"><span>🟢 WhatsApp Bisnis</span><i class="ph-bold ph-caret-right"></i></a>
            <a href="https://web.whatsapp.com/send?phone=${phone}&text=${waTextEncoded}" target="_blank" onclick="closeModal(); logAudit('Kirim WA', 'Order ${orderId} via Web')" class="flex justify-between items-center bg-gray-100 text-gray-800 border border-gray-300 p-3.5 rounded-xl font-bold text-sm"><span>💻 WhatsApp Web</span><i class="ph-bold ph-caret-right"></i></a>
        `;

        showModal('Kirim Transaksi via WhatsApp', html, '<button onclick="closeModal()" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold">Tutup</button>');
    };

                    <span>🛵 Bagian Kurir</span>

            </div>
            <div class="px-4 py-2 bg-white border-b shrink-0 no-print"><input id="adm-ord-q" placeholder="Cari kode pesanan, nama, nomor HP..." value="${escapeHTML(state.adminOrderSearch || '')}" oninput="adminSearch(this,'adminOrderSearch')" class="w-full border p-2.5 rounded-xl text-sm bg-gray-50 mb-2"><div class="flex gap-2">${[['semua', 'Semua'], ['fisik', '🛒 Produk Fisik'], ['digital', '📱 Digital']].map(([k, l]) => `<button onclick="state.adminOrderType='${k}'; render()" class="px-3 py-1 rounded-full text-[10px] font-bold border ${ty === k ? 'bg-orange-500 text-white border-orange-500' : 'bg-gray-50 text-gray-600'}">${l}</button>`).join('')}</div><p class="text-[9px] text-gray-400 mt-1.5">Pesanan Wi-Fi ada di menu Wi-Fi.</p></div>
            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-print">
                ${ords.map(o => `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border ${o.status==='Dibatalkan'||o.status==='Refund'?'opacity-60 grayscale':''}">
                        <div class="flex justify-between border-b pb-2 mb-2"><span class="font-mono text-[10px] font-bold text-gray-500">${o.id}${String(o.status).includes('Pre-Order') ? ' <b class="bg-amber-400 text-amber-950 px-1.5 rounded">PO</b>' : ''}</span><span class="text-[9px] uppercase px-2 py-0.5 rounded font-black ${o.status==='Selesai'?'bg-green-100 text-green-700':o.status.includes('Pre-Order')?'bg-purple-100 text-purple-700':o.status==='Dibatalkan'?'bg-gray-100':'bg-blue-100 text-blue-700'}">${o.status}</span></div>
                        <p class="font-black text-gray-800 text-sm mb-1">${escapeHTML(o.customerName)} <span class="bg-gray-100 text-[9px] px-2 rounded-full uppercase ml-1 border">${o.method}${o.queueNumber ? ' • Antrean ' + o.queueNumber : ''}</span></p>
                        ${o.method === 'delivery' ? `<p class="text-[11px] text-blue-700 font-bold mb-1.5">📍 ${escapeHTML(o.region || '')} — ${escapeHTML(o.address || '')}</p>` : ''}
                        ${o.customerPhone !== '-' ? `<button onclick="promptAdminSendWA('${o.id}')" class="inline-block bg-green-500 text-white px-3 py-1 rounded-lg text-[10px] font-bold shadow-sm border border-green-600 mb-2"><i class="ph-fill ph-whatsapp-logo text-sm"></i> 📤 Kirim WA</button>` : ''}
                        <button onclick="printStruk('${o.id}')" class="inline-block bg-gray-50 text-gray-700 px-3 py-1 rounded-lg text-[10px] font-bold border ml-1 mb-2"><i class="ph-bold ph-printer text-sm"></i> Struk</button>
                        <div class="space-y-1 bg-gray-50 p-2 rounded-lg border mb-2 text-xs">${o.items.map(i => `<div class="flex justify-between"><span>${i.qty}x ${escapeHTML(i.product.name)}${i.targetPhone ? ` <b class="text-purple-700">[Tujuan: ${escapeHTML(i.targetPhone)}]</b>` : ''}</span><span>${formatRp(i.purchasedPrice*i.qty)}</span></div>`).join('')}</div>

    window.findDuplicateProduct = (name, excludeId = null) => {
        const clean = String(name || '').trim().replace(/\s+/g, ' ').toLowerCase();
        if (!clean) return null;
        return state.products.find(p =>
            (excludeId === null || String(p.id) !== String(excludeId)) &&
            String(p.name || '').trim().replace(/\s+/g, ' ').toLowerCase() === clean
        ) || null;
    };

    window.checkAdminProdNameDup = (val) => {
        const inp = document.getElementById('p-n');
        const warnEl = document.getElementById('p-n-dup-warn');
        if (!warnEl) return;
        const dup = findDuplicateProduct(val);
        if (dup) {
            const idArg = JSON.stringify(dup.id).replace(/"/g, '&quot;');
            warnEl.innerHTML = `
                <div class="flex items-center justify-between gap-2 bg-amber-50 border border-amber-300 text-amber-800 px-3 py-2 rounded-xl text-xs">
                    <span>⚠️ Nama produk <b>"${escapeHTML(dup.name)}"</b> sudah ada (Stok: ${dup.stock}, ${formatRp(dup.price)}).</span>
                    <button type="button" onclick="promptEditProduct(${idArg})" class="shrink-0 bg-amber-500 text-white px-2.5 py-1 rounded-lg font-bold text-[11px]">Edit Produk</button>
                </div>`;
            warnEl.classList.remove('hidden');
            if (inp) inp.classList.add('border-amber-500', 'bg-amber-50/40');
        } else {
            warnEl.innerHTML = '';
            warnEl.classList.add('hidden');
            if (inp) inp.classList.remove('border-amber-500', 'bg-amber-50/40');
        }
    };

    window.ensureProdDupGuard = () => {
        if (typeof window.handleAddProduct === 'function' && !window.handleAddProduct._dupGuarded) {
            const _origAdd = window.handleAddProduct;
            window.handleAddProduct = function(e) {
                if (e && e.preventDefault) e.preventDefault();
                const rawName = document.getElementById('p-n')?.value.trim() || '';
                const dup = findDuplicateProduct(rawName);
                if (dup) {
                    checkAdminProdNameDup(rawName);
                    document.getElementById('p-n')?.focus();
                    showToast(`⚠️ Produk "${dup.name}" sudah ada! Gunakan nama lain.`);
                    return false;
                }
                return _origAdd.apply(this, arguments);
            };
            window.handleAddProduct._dupGuarded = true;
        }

        if (typeof window.promptEditProduct === 'function' && !window.promptEditProduct._dupGuarded) {
            const _origEdit = window.promptEditProduct;
            window.promptEditProduct = function(id) {
                const res = _origEdit.apply(this, arguments);
                setTimeout(() => {
                    const prod = state.products.find(x => String(x.id) === String(id));
                    const modalBody = document.getElementById('modal-body');
                    if (!prod || !modalBody) return;
                    const inputs = Array.from(modalBody.querySelectorAll('input[type="text"], input:not([type])'));
                    const nameInp = inputs.find(el => el.value.trim() === String(prod.name || '').trim());
                    if (!nameInp || nameInp.dataset.dupBound) return;
                    nameInp.dataset.dupBound = '1';

                    const warnBox = document.createElement('div');
                    warnBox.className = 'hidden mt-1 mb-2 text-xs bg-amber-50 border border-amber-300 text-amber-800 px-2.5 py-1.5 rounded-lg font-semibold';
                    nameInp.insertAdjacentElement('afterend', warnBox);

                    const updateEditWarn = () => {
                        const dup = findDuplicateProduct(nameInp.value, id);
                        if (dup) {
                            warnBox.textContent = `⚠️ Nama "${dup.name}" sudah dipakai produk lain!`;
                            warnBox.classList.remove('hidden');
                            nameInp.classList.add('border-amber-500');
                        } else {
                            warnBox.textContent = '';
                            warnBox.classList.add('hidden');
                            nameInp.classList.remove('border-amber-500');
                        }
                        return dup;
                    };

                    nameInp.addEventListener('input', updateEditWarn);

                    const saveBtn = Array.from(modalBody.querySelectorAll('button')).find(b => /simpan/i.test(b.textContent || ''));
                    if (saveBtn && !saveBtn.dataset.dupClickBound) {
                        saveBtn.dataset.dupClickBound = '1';
                        saveBtn.addEventListener('click', (ev) => {
                            const dup = updateEditWarn();
                            if (dup) {
                                ev.stopImmediatePropagation();
                                ev.preventDefault();
                                nameInp.focus();
                                showToast(`⚠️ Nama "${dup.name}" sudah dipakai produk lain!`);
                            }
                        }, true);
                    }
                }, 20);
                return res;
            };
            window.promptEditProduct._dupGuarded = true;
        }
    };

    window.updateProductCatsByService = (serviceType) => {
        const catEl = document.getElementById('p-c');
        const subEl = document.getElementById('p-sub');
        if (!catEl) return;
        const cats = state.categories.filter(c => !serviceType || getCatSection(c) === serviceType);
        catEl.innerHTML = '<option value="">-- 2. Pilih Kategori --</option>' +
            cats.map(c => `<option value="${escapeHTML(getCatName(c))}">${escapeHTML(getCatName(c))}</option>`).join('');
        if (subEl) subEl.innerHTML = '<option value="">-- 3. Pilih Sub-Kategori --</option>';
    };

    window.getFilteredAdminProducts = () => {
        if(!state.adminProductSectionFilter) state.adminProductSectionFilter = 'semua';
        if(!state.adminActiveSubCategory) state.adminActiveSubCategory = 'Semua';
        const q = String(state.adminProductSearch || '').toLowerCase().trim();
        let f = state.products.filter(p => {
            const pSec = p.productType || 'fisik';
            const matchesSection = state.adminProductSectionFilter === 'semua' || pSec === state.adminProductSectionFilter;
            const matchesCat = state.adminActiveCategory === 'Semua' || p.category === state.adminActiveCategory;
            const matchesSubCat = state.adminActiveSubCategory === 'Semua' || p.subCategory === state.adminActiveSubCategory;
            return matchesSection && matchesCat && matchesSubCat;
        });
        if (q) {
            f = f.filter(p =>
                String(p.name || '').toLowerCase().includes(q) ||
                String(p.barcode || '').toLowerCase().includes(q) ||
                String(p.category || '').toLowerCase().includes(q) ||
                String(p.subCategory || '').toLowerCase().includes(q)
            );
        }
        if (state.adminProductSort === 'A-Z') f.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
        else if (state.adminProductSort === 'Harga Tertinggi') f.sort((a, b) => (Number(b.price) || 0) - (Number(a.price) || 0));
        else if (state.adminProductSort === 'Stok Terendah') f.sort((a, b) => getRealProductStock(a) - getRealProductStock(b));
        else if (state.adminProductSort === 'Terlaris') f.sort((a, b) => (Number(b.sold) || 0) - (Number(a.sold) || 0));
        return f;
    };

    window.toggleAdminProdAll = (checked) => {
        const ids = getFilteredAdminProducts().map(p => p.id);
        if (checked) {
            window.selectedIds = [...new Set([...window.selectedIds, ...ids])];
        } else {
            window.selectedIds = window.selectedIds.filter(id => !ids.includes(id));
        }
        render();
    };

    window.onAdminProdSearch = (val) => {
        state.adminProductSearch = val;
        const clearBtn = document.getElementById('admin-prod-search-clear');

        if (wrap) wrap.innerHTML = renderAdminProductListInner();
        else render();

    window.renderAdminProductListInner = () => {
        const f = getFilteredAdminProducts();

        return `
            <div class="flex flex-wrap justify-between items-center gap-2 mb-3 text-xs">
                <select onchange="state.adminProductSort=this.value; render()" class="bg-gray-50 border p-2 rounded-lg font-bold">

                    <option value="Harga Tertinggi" ${state.adminProductSort==='Harga Tertinggi'?'selected':''}>Harga Tertinggi</option>
                    <option value="Stok Terendah" ${state.adminProductSort==='Stok Terendah'?'selected':''}>Stok Terendah</option>
                    <option value="Terlaris" ${state.adminProductSort==='Terlaris'?'selected':''}>Terlaris</option>
                </select>
                <label class="flex items-center gap-2 bg-gray-50 border px-2.5 py-1.5 rounded-lg cursor-pointer select-none">
                    <input type="checkbox" ${allChecked ? 'checked' : ''} onchange="toggleAdminProdAll(this.checked)" class="w-4 h-4 rounded accent-orange-500">

        return '';

        showModal('Pratinjau Impor', plan.err ? `<p class="text-xs text-red-600 font-bold">${escapeHTML(plan.err)}</p>` : `<div class="grid grid-cols-4 gap-1.5 text-center mb-3 text-[10px] font-bold"><div class="bg-green-50 text-green-700 rounded-lg p-2"><p class="text-base">${c('baru')}</p>Baru</div><div class="bg-blue-50 text-blue-700 rounded-lg p-2"><p class="text-base">${c('perbarui')}</p>Diperbarui</div><div class="bg-gray-100 text-gray-600 rounded-lg p-2"><p class="text-base">${c('lewati')}</p>Dilewati</div><div class="bg-red-50 text-red-600 rounded-lg p-2"><p class="text-base">${c('error')}</p>Bermasalah</div></div><div class="space-y-1 max-h-60 overflow-y-auto text-[11px]">${plan.items.slice(0, 40).map(x => `<div class="flex justify-between gap-2 border-b py-1"><span class="truncate">${x.n}. ${escapeHTML(x.d ? x.d.name : '-')}${x.d ? ' • ' + formatRp(x.d.price) : ''}${x.note ? ' <i class="text-amber-600">(' + escapeHTML(x.note) + ')</i>' : ''}</span><b class="${x.action === 'error' ? 'text-red-500' : x.action === 'baru' ? 'text-green-600' : x.action === 'perbarui' ? 'text-blue-600' : 'text-gray-400'} shrink-0">${x.action === 'error' ? escapeHTML(x.err) : x.action}</b></div>`).join('')}${plan.items.length > 40 ? `<p class="text-gray-400 pt-1">...dan ${plan.items.length - 40} baris lainnya</p>` : ''}</div>`,
            `<div class="flex gap-2"><button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-800 py-3 rounded-xl font-bold">Batal</button>${!plan.err && ok ? `<button onclick="applyImport()" class="flex-1 bg-orange-500 text-white py-3 rounded-xl font-bold">Impor ${ok} produk</button>` : ''}</div>`); }; r.readAsText(f); };
    window.applyImport = () => { const plan = window._plan; if(!plan || plan.err) return; window._plan = null; try { localStorage.setItem('amatBajualanProState_BACKUP_' + new Date().toISOString().replace(/[:.]/g, '-') + '_sebelum_impor', JSON.stringify(state)); } catch(e) {}
        let nb = 0, nu = 0, t0 = Date.now();
        plan.items.forEach((it, i) => { if(it.action !== 'baru' && it.action !== 'perbarui') return; const d = it.d;
            if(d.cat && !state.categories.some(c => getCatName(c).toLowerCase() === d.cat.toLowerCase())) state.categories.push({ id: 'c-' + t0 + '-' + i, name: d.cat, section: d.type || 'fisik' });
            const cat = d.cat ? getCatName(state.categories.find(c => getCatName(c).toLowerCase() === d.cat.toLowerCase())) : '';
            if(d.sub && cat && !state.subCategories.some(sc => getSubCatName(sc).toLowerCase() === d.sub.toLowerCase() && getSubCatParent(sc) === cat)) state.subCategories.push({ id: 'sc-' + t0 + '-' + i, name: d.sub, category: cat, section: d.type || 'fisik' });
            const pt = d.type || autoDetectProductType(cat, d.sub), img = d.img || `https://placehold.co/300x300/ffedd5/ea580c?text=${encodeURIComponent(d.name.substring(0, 10))}`;
            if(it.action === 'perbarui') { const p = state.products.find(x => x.id === d.exId); if(p) { Object.assign(p, { name: d.name, price: d.price, modal: d.modal, stock: d.stock, category: cat || p.category, subCategory: d.sub || p.subCategory, accessLevel: d.access, productType: pt, barcode: d.barcode || p.barcode }); if(d.img) p.img = d.img; nu++; } }
            else { state.products.unshift({ id: t0 + i, name: d.name, price: d.price, modal: d.modal, accessLevel: d.access, category: cat, subCategory: d.sub, productType: pt, img: img, stock: d.stock, minStock: 5, sold: 0, barcode: d.barcode, isActive: true, weight: 0 }); nb++; } });
        logAudit('Impor Massal', nb + ' baru, ' + nu + ' diperbarui'); saveState(); closeModal(); render(); showToast('Impor selesai: ' + nb + ' baru, ' + nu + ' diperbarui ✅'); };
    /* ===== Pintasan alamat (#kasir, #kurir, #admin, ...) ===== */
    window.ROUTES = { masuk: 'login', kasir: 'kasir_pos', kurir: 'kurir_orders', admin: 'admin_orders', 'admin-produk': 'admin_products', 'admin-topup': 'admin_topup', 'admin-pengguna': 'admin_users', 'admin-wifi': 'admin_wifi', 'admin-ppob': 'admin_ppob', 'admin-banner': 'admin_banner', 'admin-member': 'admin_levels', 'admin-kategori': 'admin_categories', 'admin-wilayah': 'admin_regions', 'admin-laporan': 'admin_reports', 'admin-atur': 'admin_settings', topup: 'cust_topup', pesanan: 'cust_orders', profil: 'cust_profile', keranjang: 'cust_cart' };
    window.viewAllowed = (v) => { const u = state.loggedInUser, r = u && u.role; if(v === 'login' || v === 'landing' || v === 'register') return true; if(!u) return false; if(v.startsWith('admin_')) return r === 'admin'; if(v.startsWith('kasir_')) return r === 'kasir' || r === 'admin'; if(v.startsWith('kurir_')) return r === 'kurir' || r === 'admin'; return true; };
    window.syncHash = (v) => { if(window._fromHash) return; const name = Object.keys(ROUTES).find(k => ROUTES[k] === v) || '', want = name ? '#' + name : ''; if((location.hash || '') !== want) { try { history.pushState(null, '', location.pathname + location.search + want); } catch(e) {} } };
    { const _nav = window.navigate; window.navigate = (view) => { if(state.loggedInUser && window._pendingRoute) { const t = window._pendingRoute; window._pendingRoute = null; if(viewAllowed(t)) view = t; } _nav(view); syncHash(view); }; }
    window.routeFromHash = () => { const h = decodeURIComponent((location.hash || '').slice(1)).toLowerCase(); let v = ROUTES[h];
        if(!h) {
            // Tidak ada alamat tambahan di URL (misal buka dari ikon PWA/tab baru).
            // Jangan paksa pindah ke halaman Pelanggan kalau halaman terakhir (admin/kasir/kurir)
            // masih valid untuk akun yang sedang login — biarkan tetap di sana.
            if(!state.loggedInUser) { v = 'landing'; if(state.view === v) return; }
            else if(viewAllowed(state.view)) { return; }
            else { v = 'cust_home'; if(state.view === v) return; }
        }
        else if(!v) return; if(state.view === v) return;
        if(!state.loggedInUser && v !== 'login' && v !== 'landing' && v !== 'register') { window._pendingRoute = v; state.view = 'login'; render(); return; }
        if(!viewAllowed(v)) { showToast('Akses ditolak untuk akun ini', 'error'); return; }
        window._fromHash = true; try { navigate(v); } finally { window._fromHash = false; } };
    window.addEventListener('popstate', () => routeFromHash());
    window.addEventListener('hashchange', () => routeFromHash());
    // Sembunyikan layar "Memuat toko..." (kalau masih ada) — dipanggil begitu ada
    // data yang sudah bisa ditampilkan, tanpa perlu nunggu Apps Script selesai.
    window.dismissBootLoader = () => {
        const b = document.getElementById('boot-loader');
        if (b && b.style.opacity !== '0') { b.style.opacity = '0'; setTimeout(() => b.remove(), 300); }
    };

    // Ambil Produk & Voucher WiFi dari Supabase (cepat) sambil nunggu Apps Script (lambat).
    // Kalau SUPABASE_URL/ANON_KEY belum diisi, atau gagal, fungsi ini diam saja —
    // app tetap jalan normal menunggu data lengkap dari Apps Script seperti biasa.
    window.loadFastFromSupabase = async () => {
        if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
        try {
            const headers = { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY };
            const [rp, rv, rk, rs] = await Promise.all([
                fetch(SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/produk?select=*", { headers }),
                fetch(SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/voucher_wifi?select=*&status=eq.available", { headers }),
                fetch(SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/kategori?select=*", { headers }),
                fetch(SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/sub_kategori?select=*", { headers })
            ]);
            const [produk, voucher, kategori, subKategori] = await Promise.all([rp.json(), rv.json(), rk.json(), rs.json()]);
            if (window._cloudReady) return; // data lengkap dari Apps Script sudah keburu datang, jangan ditimpa

            if (Array.isArray(produk) && produk.length) {
                state.products = produk.map(p => ({
                    id: p.id, name: p.name, modal: p.modal, price: p.price, accessLevel: p.access_level,
                    category: p.category, subCategory: p.sub_category, productType: p.product_type,
                    stock: p.stock, minStock: p.min_stock, sold: p.sold, barcode: p.barcode,
                    isActive: p.is_active, weight: p.weight, img: p.img
                }));
                if (Array.isArray(voucher)) {
                    state.wifiVouchers = voucher.map(v => ({
                        id: v.id, code: v.code, category: v.category, subCategory: v.sub_category,
                        status: v.status, orderId: v.order_id, pembeli: v.pembeli,
                        purchaseTimestamp: v.purchase_timestamp, dateAdded: v.date_added
                    }));
                }
                if (Array.isArray(kategori) && kategori.length) {
                    state.categories = kategori.map(c => ({ id: c.id, name: c.name, section: c.section }));
                }
                if (Array.isArray(subKategori)) {
                    state.subCategories = subKategori.map(s => ({ id: s.id, name: s.name, category: s.category, section: s.section }));
                }
                if (!window._cloudReady) { render(); dismissBootLoader(); }
            }
        } catch (e) { console.log("Supabase fast-load gagal, lanjut tunggu server utama", e); }
    };

    window.AUTO_LOGOUT_DAYS = 30;
    window.addEventListener("DOMContentLoaded", async () => {
        // Auto-logout kalau akun ini sudah lama nggak dibuka (jaga-jaga kalau HP
        // hilang/pindah tangan, supaya sesi lama nggak nyangkut selamanya).
        if (state.loggedInUser) {
            const days = (Date.now() - (state.lastActiveAt || Date.now())) / 86400000;
            if (days > AUTO_LOGOUT_DAYS) { state.loggedInUser = null; state.cart = []; state.view = 'landing'; }
        }
        state.lastActiveAt = Date.now();
        try { saveState(); } catch(e) {}
        syncDailyPrayerSchedule(false);
        render();
        // Kalau ini BUKAN kunjungan pertama (sudah ada data tersimpan di HP dari
        // sesi sebelumnya), langsung tampilkan itu dan hilangkan layar loading
        // SEKARANG JUGA — tidak perlu nunggu Supabase/Apps Script sama sekali.
        // Data terbaru tetap akan menyusul diam-diam di belakang layar begitu selesai.
        if(Array.isArray(state.products) && state.products.length > 0) dismissBootLoader();
        loadFastFromSupabase();
        setTimeout(dismissBootLoader, 2500);
        if(window._showBackupToast) { setTimeout(() => showToast('Data lama otomatis ter-backup ✅'), 500); window._showBackupToast = false; }
        const t0 = Date.now(), msgs = ['Memuat toko...', 'Menyiapkan dagangan...', 'Sedikit lagi...']; let mi = 0;
        const tick = setInterval(() => { const e = document.getElementById('boot-msg'); if(e) e.textContent = msgs[++mi % msgs.length]; }, 2500);
        const done = (msg) => { setTimeout(() => window.routeFromHash && routeFromHash(), 900); clearInterval(tick); const e = document.getElementById('boot-msg'); if(e && msg) e.textContent = msg;
            setTimeout(() => { const b = document.getElementById('boot-loader'); if(b) { b.style.opacity = '0'; setTimeout(() => b.remove(), 400); } }, Math.max(0, 700 - (Date.now() - t0))); };
        try {
            const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
            const res = await fetch(APP_SCRIPT_URL, { signal: ctl.signal }); clearTimeout(to);
            const cloudData = await res.json();
            if(cloudData && Object.keys(cloudData).length > 0 && cloudData.products) {
                window.safeMerge(cloudData, defaultState);
                cloudData.loggedInUser = (window.state && window.state.loggedInUser) || null; if(window.state && window.state.view) cloudData.view = window.state.view;
                window.state = cloudData;
                localStorage.setItem('amatBajualanProState', JSON.stringify(cloudData));
                window._cloudReady = true; render(); done('Siap! 🎉');
            } else { window._cloudReady = true; window.saveState(); done(); }
        } catch(e) { console.log('Mode Offline / Gagal Sync', e); window._cloudReady = false; done('Koneksi lemah, memakai data terakhir'); }
    });
</script>
<script src="js/gsap-init.js"></script>
<script src="js/lenis-init.js"></script>
<script src="js/motion-init.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }
</script>
